name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - staging

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: mochaaii/pos-kasir

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract version from Git tag or fallback
        id: extract_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "staging-latest")
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.extract_version.outputs.version }}
            ${{ env.IMAGE_NAME }}:staging-latest

      - name: Logout from Docker Hub
        run: docker logout
